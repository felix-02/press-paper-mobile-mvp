<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Presspaper for Android and iOS</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        background: #101522;
        color: #edf2ff;
        font:
          18px/1.6 system-ui,
          sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
      }
      a {
        display: inline-block;
        border-radius: 0.8rem;
        background: #91b0ff;
        color: #101522;
        padding: 0.7rem 1rem;
        font-weight: 700;
        text-decoration: none;
      }
      p {
        color: #adbad2;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" width="56" height="56" alt="" />
      <h1>Presspaper</h1>
      <p>
        Official updates, direct from trusted institutions. Read, save and
        follow in the Android and iOS app.
      </p>
      <a href="presspaper://">Open Presspaper</a>
      <p>
        The app must be installed to open it. Shared release links also provide
        a readable article on this site.
      </p>
    </main>
  </body>
</html>
